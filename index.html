<!DOCTYPE html>
<html>
<head>
    <title>News Summarizer</title>
</head>
<body>
    <h1>India News Summary</h1>
    <div id="summary">Loading latest summary...</div>

    <script>
        function updateSummary() {
            fetch('https://api.dailynewshighlights.com/country/india/summary')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.text(); // Changed from response.json() to response.text()
                })
                .then(text => { // Now we receive plain text
                    document.getElementById('summary').textContent = text; // Display the text directly
                })
                .catch(error => {
                    console.error('There was a problem fetching the summary:', error);
                    document.getElementById('summary').textContent = 'Failed to load summary.';
                });
        }

        updateSummary(); // Load the summary when the page loads
        setInterval(updateSummary, 3600000); // Update the summary every hour (3600000 milliseconds)
    </script>
</body>
</html>
