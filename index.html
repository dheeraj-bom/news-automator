<!DOCTYPE html>
<html>
<head>
    <title>India News Summary</title>
</head>
<body>
    <h1>India News Summary</h1>
    <div id="summary-container">
        <p>Loading summary...</p>
    </div>

    <script>
        fetch('india_summary.txt')
            .then(response => response.text())
            .then(data => {
                document.getElementById('summary-container').innerText = data;
            })
            .catch(error => {
                document.getElementById('summary-container').innerText = 'Error loading summary.';
                console.error('Error loading summary:', error);
            });
    </script>
</body>
</html>
